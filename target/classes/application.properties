spring.application.name=salesforce-crud-backend

server.port=8080


salesforce.login-url=https://login.salesforce.com

salesforce.client-id=${SALESFORCE_CLIENT_ID}
salesforce.client-secret=${SALESFORCE_CLIENT_SECRET}

salesforce.callback-url=http://localhost:8080/auth/callback

salesforce.api-version=v67.0



server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false



spring.web.cors.allowed-origins=http://localhost:5173
spring.web.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true


# Logging

logging.level.org.springframework.web=INFO
logging.level.com.salesforce.backend=INFO